# ipc: image per class, the number of synthesized images per class
# synthesis_model: the model used for generating synthesized images
# iteration: the total steps for optimization
# synthesis_lr: learning rate for generating synthesized images
# batch_real: batch size
# init: initial point of the synthesized images ('random' or 'real'
# dsa_strategy: the strategy of data augmentation
# dm_threshold: generate synthesized images when the number of image of a specific class is greater than dm_threshold
#
ipc: 50
idm_threshold: 50
synthesis_model: 'ConvNet'
iteration: 20000
# synthesis_lr: 1.0
synthesis_lr: 0.2
batch_real: 100
init: 'real'
dsa_strategy: "color_crop_cutout_flip_scale_rotate"
dm_threshold: 100
dsa: True
plot_trigger: False

lr_net: 0.01  # outer loop for network update
dis_metric: "ours"  # distance metric
outer_loop: 1  # outer loop for network update
inner_loop: 1  # outer loop for network update
eval_interval: 100  # outer loop for network update
net_train_real: false  # boolean flag
trained_bs: 256  # outer loop for network update
last: 100  # outer loop for network update
mismatch_lambda: 0.0  # outer loop for network update
net_decay: true  # boolean flag
model_train_steps: 10  # outer loop for network update
net_num: 100  # outer loop for network update
net_begin: 0  # outer loop for network update
net_end: 100000  # outer loop for network update
mismatch_type: "l1"  # outer loop for network update
ij_selection: "random"  # outer loop for network update
weight_layer_index: 0  # outer loop for network update
net_generate_interval: 30  # outer loop for network update
fetch_net_num: 2  # outer loop for network update
embed_last: 1000  # outer loop for network update
conf_path: ""  # outer loop for network update
local_num: 10  # outer loop for network update
local_weight: 0.1  # outer loop for network update
syn_ce: true  # boolean flag
ce_weight: 0.5  # outer loop for network update
optim: "sgd"  # outer loop for network update
train_net_num: 1  # outer loop for network update
aug_num: 1  # outer loop for network update
net_push_num: 1  # outer loop for network update
zca: false  # boolean flag
aug: true  # boolean flag